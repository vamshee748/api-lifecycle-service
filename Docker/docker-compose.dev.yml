# ============================================================================
# Docker Compose Development Configuration
# Lightweight setup for local development with hot reload
# Usage: docker-compose -f docker-compose.dev.yml up
# ============================================================================
version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Development)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: api-lifecycle-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: api_lifecycle_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Redis Cache (Development)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: api-lifecycle-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Application (Development - with hot reload)
  # ============================================================================
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: api-lifecycle-service:dev
    container_name: api-lifecycle-app-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://devuser:devpass@postgres:5432/api_lifecycle_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: dev-secret-key-not-for-production
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app  # Mount code for hot reload
      - ../tests:/app/tests
      - ./logs:/app/logs
    networks:
      - dev-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
